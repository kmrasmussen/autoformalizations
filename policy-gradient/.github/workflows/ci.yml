name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and lint paper claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/download/v3.1.1/elan-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache Mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: .lake
          key: lake-${{ hashFiles('lake-manifest.json', 'lean-toolchain') }}
          restore-keys: lake-

      - name: Fetch Mathlib cache
        run: |
          lake exe cache get || true

      - name: Build
        run: lake build

      # The paper-claim linter is a REQUIRED check. It fails the build when a
      # declaration carrying `@[paper "X" "Y"]` does not actually state anything
      # about a `FiniteMDP` — the drift between docstring and theorem that
      # GAPS.md documents. It also prints, for every grounded claim, the
      # MDP-level hypotheses that claim still assumes rather than proves.
      - name: Paper-claim linter
        run: lake env lean PaperLint.lean
